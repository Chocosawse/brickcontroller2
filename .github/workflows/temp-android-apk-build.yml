name: Temp Android APK Build

on:
  push:
    branches: [ temp/android-apk-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET SDK to 8.0
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature"
            }
          }
          EOF

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: >
          dotnet build BrickController2/BrickController2.Android/BrickController2.Android.csproj
          -c Debug -f net8.0-android -p:AndroidPackageFormat=apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: brickcontroller2-apk
          path: BrickController2/BrickController2.Android/bin/Debug/net8.0-android/*-Signed.apk
          if-no-files-found: error

      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(ls BrickController2/BrickController2.Android/bin/Debug/net8.0-android/*-Signed.apk)
          gh release create "temp-apk-build-${{ github.run_id }}" "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "Temp APK build ${{ github.run_id }}" \
            --notes "Temporary Android APK build for local testing. Safe to delete."
